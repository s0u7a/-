name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/math_drill.jks

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flutter build apk --release \
            --dart-define=STORE_FILE=math_drill.jks \
            --dart-define=STORE_PASSWORD=$STORE_PASSWORD \
            --dart-define=KEY_PASSWORD=$KEY_PASSWORD \
            --dart-define=KEY_ALIAS=$KEY_ALIAS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math-drill-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
